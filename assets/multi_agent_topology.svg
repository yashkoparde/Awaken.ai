      <tspan x="14" dy="14">narratives and interview</tspan>
      <tspan x="14" dy="14">responses into ATS-</tspan>
      <tspan x="14" dy="14">tailored profiles.</tspan>
    </text>
  </g>

  <!-- Adversary Card -->
  <g transform="translate(478, 25)">
    <rect width="136" height="190" rx="10" fill="#0F172A" stroke="#F43F5E" stroke-width="1.5"/>
    <rect x="14" y="16" width="28" height="28" rx="6" fill="#BE123C" fill-opacity="0.25" stroke="#F43F5E" stroke-width="1"/>
    <polygon points="28,23 35,35 21,35" stroke="#FB7185" stroke-width="1.5" fill="none"/>
    <text x="14" y="66" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Adversary</text>
    <text x="14" y="82" fill="#FB7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.06em">INTERVIEW SIM</text>
    <text x="14" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">
