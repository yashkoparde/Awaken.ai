      <tspan x="14" dy="14">downs, dynamic deep</tspan>
      <tspan x="14" dy="14">probes, and technical</tspan>
      <tspan x="14" dy="14">challenge scenarios.</tspan>
    </text>
  </g>

  <!-- Coach Card -->
  <g transform="translate(629, 25)">
    <rect width="126" height="190" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="14" y="16" width="28" height="28" rx="6" fill="#B45309" fill-opacity="0.25" stroke="#F59E0B" stroke-width="1"/>
    <path d="M 23 25 L 33 25 M 23 29 L 31 29 M 23 33 L 28 33" stroke="#FBBF24" stroke-width="1.75" stroke-linecap="round"/>
    <text x="14" y="66" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Coach</text>
    <text x="14" y="82" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.06em">SPEECH ANALYTICS</text>
    <text x="14" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">
