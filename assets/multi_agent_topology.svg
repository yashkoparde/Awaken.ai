<svg width="780" height="240" viewBox="0 0 780 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="780" height="240" rx="12" fill="#0B0F19" stroke="#1E293B"/>

  <!-- Orchestrator Card -->
  <g transform="translate(25, 25)">
    <rect width="136" height="190" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="14" y="16" width="28" height="28" rx="6" fill="#0369A1" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1"/>
    <path d="M 23 30 L 28 35 L 35 25" stroke="#38BDF8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="14" y="66" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Orchestrator</text>
    <text x="14" y="82" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.06em">STATE HARMONY</text>
    <text x="14" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" line-height="1.4">
      <tspan x="14" dy="0">Coordinates cross-</tspan>
      <tspan x="14" dy="14">session state, telemetry</tspan>
      <tspan x="14" dy="14">pipelines, and live</tspan>
      <tspan x="14" dy="14">context persistence.</tspan>
    </text>
  </g>

  <!-- Auditor Card -->
  <g transform="translate(176, 25)">
    <rect width="136" height="190" rx="10" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>
    <rect x="14" y="16" width="28" height="28" rx="6" fill="#4338CA" fill-opacity="0.25" stroke="#6366F1" stroke-width="1"/>
    <circle cx="28" cy="30" r="6" stroke="#818CF8" stroke-width="1.75" fill="none"/>
    <line x1="33" y1="35" x2="37" y2="39" stroke="#818CF8" stroke-width="1.75" stroke-linecap="round"/>
    <text x="14" y="66" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Auditor</text>
    <text x="14" y="82" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.06em">ATS SCANNER</text>
    <text x="14" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">
      <tspan x="14" dy="0">Evaluates schema</tspan>
      <tspan x="14" dy="14">integrity, keyword gap</tspan>
      <tspan x="14" dy="14">frequency, and action</tspan>
      <tspan x="14" dy="14">verb distributions.</tspan>
    </text>
  </g>

  <!-- Architect Card -->
  <g transform="translate(327, 25)">
    <rect width="136" height="190" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <rect x="14" y="16" width="28" height="28" rx="6" fill="#047857" fill-opacity="0.25" stroke="#10B981" stroke-width="1"/>
    <rect x="22" y="24" width="12" height="12" rx="2" stroke="#34D399" stroke-width="1.75" fill="none"/>
